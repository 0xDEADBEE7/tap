[package]
name = "tap"
version = "0.2.0"
edition = "2021"
description = "Traffic Access Proxy"

[dependencies]
base64 = "0.22"
brotli = "7"
bytes = "1"
flate2 = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
libc = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "process", "time", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[test]]
name = "proxy"
path = "test/proxy.rs"

[[test]]
name = "cli"
path = "test/cli.rs"
